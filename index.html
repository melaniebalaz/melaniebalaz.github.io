<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melanie Balaz</title>
  <meta name="description" content="Photography portfolio of Melanie Balaz.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-home">
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="index.html">Melanie Balaz</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        Menu
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <div class="nav-group nav-work">
          <a href="#work" aria-haspopup="true">Work</a>
          <div class="work-dropdown" aria-label="Work sections">
            <a class="dropdown-link" href="romance.html">Romance</a>
            <a class="dropdown-link" href="moments.html">Moments</a>
            <a class="dropdown-link" href="places.html">Places</a>
          </div>
        </div>
        <a href="#about">About</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <img src="assets/home/hero-placeholder.jpg" alt="Placeholder hero photograph">
        <div class="hero-copy">
          <h1>Telling stories...</h1>
        </div>
      </section>

      <section class="work-section" id="work">
        <div class="section-spacer" aria-hidden="true"></div>
        <div class="card-grid">
          <a class="story-card" href="romance.html">
            <div class="story-image-wrap">
              <img src="assets/romance/cover-placeholder.jpg" alt="Placeholder photograph for romance">
            </div>
            <span>Romance</span>
          </a>
          <a class="story-card" href="moments.html">
            <div class="story-image-wrap">
              <img src="assets/moments/cover-placeholder.jpg" alt="Placeholder photograph for moments">
            </div>
            <span>Moments</span>
          </a>
          <a class="story-card" href="places.html">
            <div class="story-image-wrap">
              <img src="assets/places/cover-placeholder.jpg" alt="Placeholder photograph for places">
            </div>
            <span>Places</span>
          </a>
        </div>
      </section>

      <section class="about-section" id="about">
        <div class="about-inner">
          <p class="eyebrow">About</p>
          <p class="about-text">
            I use both science and art as ways of understanding the world, shaping that understanding through creation.
          </p>
          <p class="about-contact">
            Based in Innsbruck. Reach me at melanie.j.balaz(at)gmail(dot)com
          </p>
        </div>
      </section>
    </main>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
